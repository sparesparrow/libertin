# Libertin CI — install → type-check → test → build.
# Stage contract and local reproduction: docs/ci.md
# GitLab translation of the same four stages: .gitlab-ci.yml
name: CI

# This repository IS the Libertin monorepo — the git root is the pnpm workspace
# root — so there is no paths filter to scope the workflow to a subdirectory.
on:
  pull_request:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Deployed client to run the module + platform suites against'
        required: false
        default: 'https://libertin.app'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  # Stage 1 — install. Validates the committed lockfile and warms the pnpm
  # content-addressable store cache that every later stage restores.
  install:
    name: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile

  # Stage 2 — type-check. `turbo run type-check` across all 6 workspaces.
  type-check:
    name: type-check
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm type-check
        run: pnpm type-check

  # Stage 3 — test. Root vitest run: it picks up every workspace project, so a
  # package that forgets to wire its own `test` script is still covered.
  test:
    name: test
    needs: type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm test:all
        run: pnpm test:all

  # Stage 4 — build. `turbo run build`; today that is the Next.js production
  # build of apps/web (next lint + tsc run inside it).
  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm build
        run: pnpm build

  # Stage 5 — pack. Guards the publishable surface of the four shared packages
  # without publishing anything: a dry-run publish resolves the same manifests,
  # `files` globs and workspace: rewrites that release.yml would.
  #
  # This exists because packaging mistakes are silent — nothing in
  # type-check/test/build notices a stray test file in `files` or an app that
  # lost its "private": true — and they are only expensive once a bad tarball
  # is on a registry, where it cannot be taken back.
  pack:
    name: pack
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: apps must stay unpublishable
        run: |
          set -euo pipefail
          publishable="$(pnpm -r list --depth -1 --json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                console.log(JSON.parse(s).filter(p=>p.private!==true&&p.name).map(p=>p.name).sort().join(" "));
              })')"
          expected='@libertin/api @libertin/i18n @libertin/theme @libertin/ui'
          if [ "$publishable" != "$expected" ]; then
            echo "::error::Publishable set changed. expected: $expected / actual: $publishable"
            exit 1
          fi
      - name: pnpm publish --dry-run
        # Contacts no registry and needs no token; it packs and reports.
        run: pnpm publish -r --filter './packages/*' --dry-run --no-git-checks

  # Stage 6 — end-to-end against this repo's own client (backlog E11-T5).
  #
  # Gates merges, because it is deterministic: it builds apps/web, serves the
  # production build and drives it with stubbed network calls. No deployment,
  # no credentials, no third party. The module suite is the opposite and lives
  # in its own manual job below.
  e2e:
    name: e2e (apps/web)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Cypress binary is ~250 MB and lives outside node_modules, so the
      # pnpm cache does not cover it.
      - name: cache the Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: cypress-${{ runner.os }}-
      - name: install the Cypress binary
        # `pnpm install` cannot be relied on for this. The pnpm store cache
        # restored by setup-node makes pnpm treat cypress as already built, so
        # it skips the postinstall that downloads the binary — but the binary
        # lives in ~/.cache/Cypress, which that cache does not cover. On a cold
        # Cypress cache the result is a store that says "installed" and a disk
        # with no browser, which is what failed the first run of this job.
        # `cypress install` is idempotent: a no-op when the binary is present.
        run: pnpm --filter @libertin/e2e cy:install
      - name: cypress verify
        run: pnpm --filter @libertin/e2e cy:verify
      - name: build the app under test
        run: pnpm --filter @libertin/web build
      - name: run the local suite
        run: pnpm --filter @libertin/e2e e2e:local:ci
      - name: archive failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-local-artifacts
          path: |
            apps/e2e/screenshots/
            apps/e2e/reports/
          if-no-files-found: ignore

  # Stage 7 — end-to-end against a deployed client. Manual, on purpose.
  #
  # Two reasons it cannot gate merges. It targets a deployment this pipeline
  # does not produce, so a red run may be reporting on someone else's push; and
  # seven of the nine modules sit behind a login, so it needs a test account
  # that only exists as a secret. Without that account those specs skip rather
  # than pass — see apps/e2e/README.md.
  #
  # Second trigger: a push whose commit message contains `[e2e-deployed]`. It
  # exists because a session whose GitHub integration may push but not start
  # workflows (403 on workflow_dispatch) otherwise has no way to run this job
  # on a real runner. Opt-in per commit, like `[skip ci]`, so ordinary pushes
  # are unaffected — and on a push there is no dispatch input, so the target
  # resolves to the repository variable or the built-in default.
  e2e-modules:
    name: e2e (modules, deployed)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       contains(github.event.head_commit.message, '[e2e-deployed]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: cache the Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: cypress-${{ runner.os }}-
      - name: install the Cypress binary
        # `pnpm install` cannot be relied on for this. The pnpm store cache
        # restored by setup-node makes pnpm treat cypress as already built, so
        # it skips the postinstall that downloads the binary — but the binary
        # lives in ~/.cache/Cypress, which that cache does not cover. On a cold
        # Cypress cache the result is a store that says "installed" and a disk
        # with no browser, which is what failed the first run of this job.
        # `cypress install` is idempotent: a no-op when the binary is present.
        run: pnpm --filter @libertin/e2e cy:install
      # Resolve the target once, in one place, with a default that is a real
      # deployment. Without the default an unset variable resolves to the empty
      # string, Cypress falls back to its own localhost default, and the job
      # fails against a port nothing is listening on — which reads like the
      # site is down rather than like the pipeline is misconfigured.
      #
      # The values go through `env:` rather than being interpolated into the
      # script: a `${{ }}` expression is pasted in before bash ever sees it, so
      # a crafted dispatch input would be executed rather than assigned.
      - name: resolve the target
        id: target
        env:
          INPUT_URL: ${{ inputs.base_url }}
          VAR_URL: ${{ vars.E2E_BASE_URL }}
        run: |
          url="${INPUT_URL:-${VAR_URL:-https://libertin.app}}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### e2e proti nasazenému klientovi" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Cíl: \`$url\`" >> "$GITHUB_STEP_SUMMARY"

      # Say it out loud. Without the account seven of the ten modules skip, and
      # a run that skips most of the product must not be mistaken for a run that
      # verified it.
      - name: report whether a test account is configured
        env:
          USERNAME: ${{ secrets.E2E_TEST_USERNAME }}
          PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          if [ -z "$USERNAME" ] || [ -z "$PASSWORD" ]; then
            echo "::warning title=No e2e test account::E2E_TEST_USERNAME / E2E_TEST_PASSWORD are not set. The seven modules behind the login will SKIP, not pass — most of the product goes unverified. See D-009."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ **Bez testovacího účtu.** Sedm z deseti modulů se přeskočí, nikoli projde (D-009)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ Testovací účet nastaven — moduly za přihlášením se testují." >> "$GITHUB_STEP_SUMMARY"
          fi

      # The two suites run as separate steps, each allowed to fail, because
      # `run: |` with both commands aborts at the first failure under `bash -e`.
      # The module suite currently fails on one assertion, which would mean the
      # platform suite — a11y, výkon, úniky dat, česká kopie — never ran at all.
      - name: module suite
        id: modules
        continue-on-error: true
        env:
          CYPRESS_BASE_URL: ${{ steps.target.outputs.url }}
          CYPRESS_TEST_USERNAME: ${{ secrets.E2E_TEST_USERNAME }}
          CYPRESS_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: pnpm --filter @libertin/e2e e2e:modules

      - name: platform suite
        id: platform
        continue-on-error: true
        env:
          CYPRESS_BASE_URL: ${{ steps.target.outputs.url }}
          CYPRESS_TEST_USERNAME: ${{ secrets.E2E_TEST_USERNAME }}
          CYPRESS_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: pnpm --filter @libertin/e2e e2e:platform

      # Findings are observations the suite reports without failing on them, so
      # they never reach the exit code. Putting them in the run summary is what
      # makes them readable without downloading an artifact.
      - name: publish findings to the run summary
        if: always()
        run: |
          # Recursive: each suite writes its own reports/<host>/<suite>/ folder
          # (see LIBERTIN_SUITE in cypress.config.ts), one level deeper than a
          # `reports/*/findings.txt` glob reaches.
          found=0
          while IFS= read -r f; do
            found=1
            {
              echo ""
              echo "<details><summary>Nálezy — $f</summary>"
              echo ""
              echo '```'
              cat "$f"
              echo '```'
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          done < <(find apps/e2e/reports -name findings.txt 2>/dev/null | sort)
          [ "$found" = "1" ] || echo "_Žádné nálezy nebyly zapsány._" >> "$GITHUB_STEP_SUMMARY"

      # Both suites ran; now decide the job. Without this the `continue-on-error`
      # steps above would leave the job green with failing tests in it.
      - name: fail the job if either suite failed
        if: always()
        env:
          MODULES: ${{ steps.modules.outcome }}
          PLATFORM: ${{ steps.platform.outcome }}
        run: |
          echo "moduly: $MODULES, platforma: $PLATFORM"
          if [ "$MODULES" != "success" ] || [ "$PLATFORM" != "success" ]; then
            echo "::error::e2e proti nasazenému klientovi selhalo (moduly: $MODULES, platforma: $PLATFORM)"
            exit 1
          fi
      - name: archive findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-module-findings
          path: |
            apps/e2e/reports/
            apps/e2e/screenshots/
          if-no-files-found: warn

  # Stage 8 — performance (C12.1). Manual only, on purpose.
  #
  # Shared runners are noisy neighbours: the same commit can swing by hundreds
  # of milliseconds between runs. Gating merges on that yields flaky red builds
  # and trains everyone to re-run until green, which is worse than no gate. Run
  # this against a representative host instead. Rationale: perf/k6/README.md.
  perf:
    name: perf (C12.1)
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build the app under test
        run: pnpm --filter @libertin/web build
      - name: install k6
        run: |
          curl -sSL https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz \
            | tar xz --strip-components=1 -C /usr/local/bin k6-v0.54.0-linux-amd64/k6
          k6 version
      - name: start the app
        run: |
          pnpm --filter @libertin/web start &
          # Production build, not `next dev` — dev-mode numbers are meaningless.
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:3000/ && exit 0
            sleep 1
          done
          echo "app did not come up" >&2
          exit 1
      - name: k6 run
        # Exits 99 when a threshold is crossed, which fails this step.
        run: k6 run perf/k6/web-browse.js
      - name: archive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: perf/k6/.results/
          if-no-files-found: warn
