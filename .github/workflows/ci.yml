# Libertin CI — install → type-check → test → build.
# Stage contract and local reproduction: docs/ci.md
# GitLab translation of the same four stages: .gitlab-ci.yml
name: CI

# This repository IS the Libertin monorepo — the git root is the pnpm workspace
# root — so there is no paths filter to scope the workflow to a subdirectory.
on:
  pull_request:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  # Stage 1 — install. Validates the committed lockfile and warms the pnpm
  # content-addressable store cache that every later stage restores.
  install:
    name: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile

  # Stage 2 — type-check. `turbo run type-check` across all 6 workspaces.
  type-check:
    name: type-check
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm type-check
        run: pnpm type-check

  # Stage 3 — test. Root vitest run: it picks up every workspace project, so a
  # package that forgets to wire its own `test` script is still covered.
  test:
    name: test
    needs: type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm test:all
        run: pnpm test:all

  # Stage 4 — build. `turbo run build`; today that is the Next.js production
  # build of apps/web (next lint + tsc run inside it).
  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm build
        run: pnpm build

  # Stage 5 — pack. Guards the publishable surface of the four shared packages
  # without publishing anything: a dry-run publish resolves the same manifests,
  # `files` globs and workspace: rewrites that release.yml would.
  #
  # This exists because packaging mistakes are silent — nothing in
  # type-check/test/build notices a stray test file in `files` or an app that
  # lost its "private": true — and they are only expensive once a bad tarball
  # is on a registry, where it cannot be taken back.
  pack:
    name: pack
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: apps must stay unpublishable
        run: |
          set -euo pipefail
          publishable="$(pnpm -r list --depth -1 --json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                console.log(JSON.parse(s).filter(p=>p.private!==true&&p.name).map(p=>p.name).sort().join(" "));
              })')"
          expected='@libertin/api @libertin/i18n @libertin/theme @libertin/ui'
          if [ "$publishable" != "$expected" ]; then
            echo "::error::Publishable set changed. expected: $expected / actual: $publishable"
            exit 1
          fi
      - name: pnpm publish --dry-run
        # Contacts no registry and needs no token; it packs and reports.
        run: pnpm publish -r --filter './packages/*' --dry-run --no-git-checks

  # Stage 6 — performance (C12.1). Manual only, on purpose.
  #
  # Shared runners are noisy neighbours: the same commit can swing by hundreds
  # of milliseconds between runs. Gating merges on that yields flaky red builds
  # and trains everyone to re-run until green, which is worse than no gate. Run
  # this against a representative host instead. Rationale: perf/k6/README.md.
  perf:
    name: perf (C12.1)
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build the app under test
        run: pnpm --filter @libertin/web build
      - name: install k6
        run: |
          curl -sSL https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz \
            | tar xz --strip-components=1 -C /usr/local/bin k6-v0.54.0-linux-amd64/k6
          k6 version
      - name: start the app
        run: |
          pnpm --filter @libertin/web start &
          # Production build, not `next dev` — dev-mode numbers are meaningless.
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:3000/ && exit 0
            sleep 1
          done
          echo "app did not come up" >&2
          exit 1
      - name: k6 run
        # Exits 99 when a threshold is crossed, which fails this step.
        run: k6 run perf/k6/web-browse.js
      - name: archive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: perf/k6/.results/
          if-no-files-found: warn
