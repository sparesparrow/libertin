# Android — verification, standalone PR preview, signed AAB build, protected Play handoff.
# Setup, secrets, current Play blockers and known limits: docs/android-release.md
name: Android

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android.yml'
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build a signed release AAB from main (does not publish)'
        type: boolean
        default: false
      publish:
        description: 'Attempt the separately protected Google Play draft step (currently eligibility-blocked)'
        type: boolean
        default: false
      track:
        description: 'Google Play track; production promotion remains manual in Play Console'
        type: choice
        options:
          - internal
          - alpha
          - beta
        default: internal

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: 'true'
  DO_NOT_TRACK: '1'

jobs:
  verify:
    name: verify (type-check, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: type-check (mobile and the packages it depends on)
        run: pnpm exec turbo run type-check --filter=@libertin/mobile...
      - name: test
        run: pnpm exec vitest run apps/mobile
      - name: test Android launch smoke helpers
        run: python3 -m unittest scripts.tests.test_android_launch_smoke

  # Installable PR artifact with the JS bundle embedded. It is deliberately a
  # mock-backed preview, under a package id distinct from any Play application,
  # and is signed with a disposable key generated inside this job.
  preview-apk:
    name: build (standalone mock preview APK)
    needs: verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # actions: read and pull-requests: write are used only by the failure
    # diagnostics step, which comments on same-repository PRs.
    permissions:
      contents: read
      actions: read
      pull-requests: write
    env:
      # Each build attempt is a separate package because this job rotates its
      # disposable signing key; never force-install over another run's data.
      PREVIEW_PACKAGE: cz.libertin.preview.run${{ github.run_number }}.attempt${{ github.run_attempt }}
      EXPO_PUBLIC_NETWORK_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      # React Native's Gradle autolinking does not cope with pnpm's isolated
      # node_modules (.npmrc: shamefully-hoist=false). The lockfile is
      # linker-independent, so a hoisted install is valid for this job only.
      - name: pnpm install (hoisted)
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: create disposable preview signing key
        env:
          STORE: ${{ runner.temp }}/libertin-preview.p12
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -storetype PKCS12 \
            -keystore "$STORE" \
            -storepass preview-only-password \
            -keypass preview-only-password \
            -alias libertin-preview \
            -keyalg RSA \
            -keysize 2048 \
            -validity 30 \
            -dname 'CN=Libertin Preview,O=CI,C=CZ'

      - name: expo prebuild (preview android)
        env:
          ANDROID_PACKAGE: ${{ env.PREVIEW_PACKAGE }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: pnpm --filter @libertin/mobile exec expo prebuild --platform android --no-install --clean

      - name: gradle assembleRelease (embedded JS)
        working-directory: apps/mobile/android
        env:
          LIBERTIN_UPLOAD_STORE_FILE: ${{ runner.temp }}/libertin-preview.p12
          LIBERTIN_UPLOAD_STORE_PASSWORD: preview-only-password
          LIBERTIN_UPLOAD_KEY_ALIAS: libertin-preview
          LIBERTIN_UPLOAD_KEY_PASSWORD: preview-only-password
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: verify standalone preview artifact
        env:
          EXPECTED_PACKAGE: ${{ env.PREVIEW_PACKAGE }}
        run: |
          set -euo pipefail
          apk='apps/mobile/android/app/build/outputs/apk/release/app-release.apk'
          test -f "$apk"

          if ! unzip -l "$apk" | grep -q 'assets/index.android.bundle'; then
            echo '::error::Release APK is missing assets/index.android.bundle and may require Metro.'
            exit 1
          fi

          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          if [ -z "$aapt" ]; then
            echo '::error::Could not locate aapt to verify the preview application id.'
            exit 1
          fi
          actual_package="$("$aapt" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          if [ "$actual_package" != "$EXPECTED_PACKAGE" ]; then
            echo "::error::Preview package mismatch: expected $EXPECTED_PACKAGE, got $actual_package"
            exit 1
          fi

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          if [ -z "$apksigner" ]; then
            echo '::error::Could not locate apksigner to verify the disposable preview signature.'
            exit 1
          fi
          "$apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/preview-signature.txt"
          grep -q 'CN=Libertin Preview' "$RUNNER_TEMP/preview-signature.txt"

          printf 'mode=mock\npackage=%s\nstandalone_bundle=assets/index.android.bundle\n' \
            "$actual_package" > "$RUNNER_TEMP/preview-metadata.txt"

      - name: install Android emulator system image
        env:
          SYSTEM_IMAGE: system-images;android-35;google_apis;x86_64
          ANDROID_AVD_HOME: ${{ runner.temp }}/libertin-avd
        run: |
          set -euo pipefail
          # Persist SDK tools for later workflow steps too; PATH exports are step-local.
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p "$ANDROID_AVD_HOME"
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager --install "emulator" "platform-tools" "platforms;android-35" "$SYSTEM_IMAGE"
          printf 'no\n' | avdmanager create avd \
            --force \
            --path "$ANDROID_AVD_HOME" \
            --name libertin-preview-smoke \
            --package "$SYSTEM_IMAGE" \
            --device pixel_2
          export PATH="$ANDROID_HOME/emulator:$PATH"
          if ! emulator -list-avds | grep -Fxq libertin-preview-smoke; then
            find "$ANDROID_AVD_HOME" -maxdepth 2 -print
            echo '::error::Android preview smoke AVD was not registered after creation.'
            exit 1
          fi

      - name: Enable and verify KVM for the Android emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          ls -l /dev/kvm
          emulator -accel-check

      - name: start isolated Android emulator
        env:
          ANDROID_SERIAL: emulator-5554
          ANDROID_AVD_HOME: ${{ runner.temp }}/libertin-avd
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          emulator -avd libertin-preview-smoke \
            -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data \
            -gpu swiftshader_indirect > "$RUNNER_TEMP/libertin-emulator.log" 2>&1 &
          emulator_pid=$!
          echo "$emulator_pid" > "$RUNNER_TEMP/libertin-emulator.pid"
          adb_ready=false
          for attempt in $(seq 1 180); do
            if [ "$(adb -s "$ANDROID_SERIAL" get-state 2>/dev/null || true)" = 'device' ]; then
              adb_ready=true
              break
            fi
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              tail -n 120 "$RUNNER_TEMP/libertin-emulator.log"
              echo '::error::Android preview smoke emulator exited before ADB connected.'
              exit 1
            fi
            sleep 1
          done
          if [ "$adb_ready" != true ]; then
            tail -n 120 "$RUNNER_TEMP/libertin-emulator.log"
            echo '::error::Android preview smoke emulator did not connect to ADB within 180 seconds.'
            exit 1
          fi
          ready=false
          for attempt in $(seq 1 180); do
            if [ "$(adb -s "$ANDROID_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" = '1' ]; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            tail -n 120 "$RUNNER_TEMP/libertin-emulator.log"
            echo '::error::Android preview smoke emulator did not finish booting.'
            exit 1
          fi

      - name: cold-start and accessibility smoke test
        env:
          ANDROID_SERIAL: emulator-5554
        run: |
          set -euo pipefail
          python3 scripts/android_launch_smoke.py \
            --serial "$ANDROID_SERIAL" \
            --apk apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
            --package "$PREVIEW_PACKAGE" \
            --expected-text 'Přihlášení' \
            --duration-seconds 20 \
            --relaunch-seconds 5 \
            --evidence-dir "$RUNNER_TEMP/libertin-startup-smoke" 2>&1 \
            | tee "$RUNNER_TEMP/smoke-output.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: libertin-preview-mock-apk
          path: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            ${{ runner.temp }}/preview-metadata.txt
          if-no-files-found: error
          retention-days: 7

      # Mock-only preview: nothing here is secret. This makes a CI failure
      # readable from the PR without downloading job logs.
      - name: report failure diagnostics to the PR
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          report="$RUNNER_TEMP/failure-report.md"
          logcat="$RUNNER_TEMP/libertin-startup-smoke/preview-app-logcat.txt"
          {
            echo '### Android preview job failure diagnostics'
            echo "Commit \`$HEAD_SHA\`, run $RUN_ID, attempt $RUN_ATTEMPT"
            echo
            echo 'Failed steps:'
            gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs" \
              --jq '.jobs[] | select(.name == "build (standalone mock preview APK)") | .steps[] | select(.conclusion == "failure") | "- " + .name'
            echo
            echo 'Smoke output (tail):'
            echo '```'
            tail -n 40 "$RUNNER_TEMP/smoke-output.txt" 2>/dev/null || echo '(none)'
            echo '```'
            echo 'App logcat, errors only (tail):'
            echo '```'
            grep -E ' (E|F) |AndroidRuntime|ReactNativeJS|FATAL' "$logcat" 2>/dev/null | tail -n 60 || echo '(none)'
            echo '```'
            echo 'Emulator log (tail):'
            echo '```'
            tail -n 25 "$RUNNER_TEMP/libertin-emulator.log" 2>/dev/null || echo '(none)'
            echo '```'
          } > "$report"
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$report"
          exit 0

  # Builds a production-signed AAB only. It does NOT publish to Google Play.
  # Live mode has no default backend: both package id and verified API base URL
  # must be configured explicitly in the protected play-release environment.
  release-aab:
    name: release (build signed AAB only)
    needs: verify
    if: >-
      startsWith(github.ref, 'refs/tags/android-v') ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.build_release == true || inputs.publish == true) &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: play-release
    env:
      EXPO_PUBLIC_NETWORK_MODE: live
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.LIBERTIN_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: pnpm install (hoisted)
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: require explicit release identity and verified API base
        env:
          ANDROID_PACKAGE: ${{ vars.ANDROID_PACKAGE }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_PACKAGE:-}" ]; then
            echo '::error::ANDROID_PACKAGE repository/environment variable is required for a release build.'
            exit 1
          fi
          if [ -z "${EXPO_PUBLIC_API_BASE_URL:-}" ]; then
            echo '::error::LIBERTIN_API_BASE_URL must be configured from verified live-contract evidence.'
            exit 1
          fi

      - name: resolve version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          OFFSET: ${{ vars.ANDROID_VERSION_CODE_OFFSET }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = 'tag' ]; then
            version="${REF_NAME#android-v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag must look like android-v1.2.3, got $REF_NAME"
              exit 1
            fi
            echo "app_version=$version" >> "$GITHUB_OUTPUT"
          fi
          echo "version_code=$(( RUN_NUMBER + ${OFFSET:-0} ))" >> "$GITHUB_OUTPUT"

      - name: decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo '::error::ANDROID_KEYSTORE_BASE64 is not set'
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - name: expo prebuild (android)
        env:
          ANDROID_PACKAGE: ${{ vars.ANDROID_PACKAGE }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: pnpm --filter @libertin/mobile exec expo prebuild --platform android --no-install --clean

      - name: gradle bundleRelease
        working-directory: apps/mobile/android
        env:
          LIBERTIN_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.keystore
          LIBERTIN_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LIBERTIN_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LIBERTIN_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: verify the bundle is signed with the upload key
        env:
          EXPECTED_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          aab='apps/mobile/android/app/build/outputs/bundle/release/app-release.aab'
          out="$(keytool -printcert -jarfile "$aab")"
          echo "$out"
          if grep -q 'CN=Android Debug' <<<"$out"; then
            echo '::error::The bundle is signed with the debug key'
            exit 1
          fi
          if [ -n "${EXPECTED_SHA256:-}" ]; then
            actual="$(grep -m1 'SHA256:' <<<"$out" | awk '{print $2}')"
            if [ "$actual" != "$EXPECTED_SHA256" ]; then
              echo '::error::Upload certificate fingerprint mismatch'
              exit 1
            fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: libertin-release-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

  # Separate protected handoff. It is intentionally blocked while Expo SDK 52
  # targets API 34: since 2026-08-31 Google Play requires API 36 for new apps
  # and updates. Remove this gate only in the PR that proves targetSdk >= 36 and
  # completes the outstanding Play policy/store configuration.
  publish-play:
    name: publish (Google Play draft — eligibility gate)
    needs: release-aab
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish == true &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: play-release
    steps:
      - name: current Play eligibility gate
        run: |
          echo '::error::Google Play submission is intentionally blocked: Expo SDK 52 targets API 34; Google Play requires API 36 for new apps and updates since 2026-08-31.'
          exit 1

      # Kept behind the hard gate above so the release capability is explicit
      # without allowing this PR to submit anything to the store.
      - uses: actions/download-artifact@v4
        if: ${{ false }}
        with:
          name: libertin-release-aab
          path: dist

      - name: upload to Google Play
        if: ${{ false }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.ANDROID_PACKAGE }}
          releaseFiles: dist/app-release.aab
          track: ${{ inputs.track }}
          status: draft
