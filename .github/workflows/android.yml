# Android — verify, debug build on pull requests, signed release to Google Play.
# Setup, secrets and known limits: docs/android-release.md
name: Android

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android.yml'
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      release:
        description: 'Build a signed AAB and upload it to Google Play (main branch only)'
        type: boolean
        default: false
      track:
        description: 'Google Play track (production is promoted manually in Play Console)'
        type: choice
        options:
          - internal
          - alpha
          - beta
        default: internal

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: 'true'
  DO_NOT_TRACK: '1'

jobs:
  verify:
    name: verify (type-check, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: type-check (mobile and the packages it depends on)
        run: pnpm exec turbo run type-check --filter=@libertin/mobile...
      - name: test
        run: pnpm exec vitest run apps/mobile

  # Proves the native project builds. Needs no secrets, so it also runs for
  # pull requests from forks.
  debug-apk:
    name: build (debug APK)
    needs: verify
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # React Native's Gradle autolinking does not cope with pnpm's isolated
      # node_modules (.npmrc: shamefully-hoist=false). The lockfile is
      # linker-independent, so a hoisted install is valid for this job only.
      - name: pnpm install (hoisted)
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted
      - name: expo prebuild (android)
        run: pnpm --filter @libertin/mobile exec expo prebuild --platform android --no-install --clean
      - name: gradle assembleDebug
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: libertin-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: release (Google Play)
    needs: verify
    if: >-
      startsWith(github.ref, 'refs/tags/android-v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release == true && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Configure required reviewers on this environment. Secrets live here too.
    environment: play-release
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: pnpm install (hoisted)
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: resolve version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          OFFSET: ${{ vars.ANDROID_VERSION_CODE_OFFSET }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#android-v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag must look like android-v1.2.3, got $REF_NAME"
              exit 1
            fi
            echo "app_version=$version" >> "$GITHUB_OUTPUT"
          fi
          echo "version_code=$(( RUN_NUMBER + ${OFFSET:-0} ))" >> "$GITHUB_OUTPUT"

      - name: decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - name: expo prebuild (android)
        env:
          ANDROID_PACKAGE: ${{ vars.ANDROID_PACKAGE }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: pnpm --filter @libertin/mobile exec expo prebuild --platform android --no-install --clean

      - name: gradle bundleRelease
        working-directory: apps/mobile/android
        env:
          LIBERTIN_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.keystore
          LIBERTIN_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LIBERTIN_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LIBERTIN_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: verify the bundle is signed with the upload key
        env:
          EXPECTED_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          aab="apps/mobile/android/app/build/outputs/bundle/release/app-release.aab"
          out="$(keytool -printcert -jarfile "$aab")"
          echo "$out"
          if grep -q 'CN=Android Debug' <<<"$out"; then
            echo "::error::The bundle is signed with the debug key"
            exit 1
          fi
          if [ -n "${EXPECTED_SHA256:-}" ]; then
            actual="$(grep -m1 'SHA256:' <<<"$out" | awk '{print $2}')"
            if [ "$actual" != "$EXPECTED_SHA256" ]; then
              echo "::error::Upload certificate fingerprint mismatch"
              exit 1
            fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: libertin-release-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.ANDROID_PACKAGE || 'cz.libertin.app' }}
          releaseFiles: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: draft
