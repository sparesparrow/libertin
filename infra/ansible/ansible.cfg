# Ansible defaults for Libertin (C11.2 — deploy the whole system from source
# text). Committed so every operator runs with the same settings; nothing here
# depends on a particular workstation.
#
# Run from this directory:
#   cd infra/ansible && ansible-playbook -i inventories/example/hosts.yml playbooks/site.yml

[defaults]
inventory = inventories/example/hosts.yml
roles_path = roles
collections_path = collections
# Show which host failed on what, without scrolling a wall of JSON.
stdout_callback = yaml
# A play that changed nothing should be visibly boring.
display_skipped_hosts = false
# Facts are gathered per play; cache them so repeated runs over a slow link do
# not re-interrogate every host.
fact_caching = jsonfile
fact_caching_connection = .facts
fact_caching_timeout = 3600
# Host key checking stays ON. Turning it off is the usual convenience shortcut
# and it removes the only protection against a MITM on the deploy path — for a
# platform whose members risk real-world harm, that is not a trade we make.
host_key_checking = true
interpreter_python = auto_silent
force_valid_group_names = ignore

[ssh_connection]
# Reuse one SSH connection per host across tasks: the single biggest speed-up
# for role-heavy plays over a WAN.
pipelining = true
ssh_args = -o ControlMaster=auto -o ControlPersist=300s -o PreferredAuthentications=publickey

[privilege_escalation]
become = false
become_method = sudo
