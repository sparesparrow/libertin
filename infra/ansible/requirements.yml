# Collections these roles depend on. Install before the first run:
#   ansible-galaxy collection install -r requirements.yml
#
# Versions are floors, not pins. Pin them exactly (`==`) before handover to the
# external operator (C8) so their runs reproduce ours.
---
collections:
  # community.docker — docker_compose_v2
  - name: community.docker
    version: ">=3.10.0"
  # community.general — timezone
  - name: community.general
    version: ">=8.0.0"
  # ansible.posix — sysctl
  - name: ansible.posix
    version: ">=1.5.0"
