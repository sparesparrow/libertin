# Example inventory — copy to inventories/<environment>/ and edit.
#
# Committed as `example` on purpose: the real inventory names real machines, and
# hostnames of a platform like this are themselves sensitive (C2, discretion as
# a feature). Keep production inventories out of a public repository — see
# docs/ansible.md for how to hold them.
#
# The group layout mirrors docker-compose.yml, including the parts that do not
# exist yet, so adding a service later is filling in a group rather than
# reshaping the inventory.
---
all:
  children:
    # Hosts running the public-facing web container. More than one entry here is
    # what HA (C5/C9) looks like once the load balancer lands (E10-T4).
    web:
      hosts:
        libertin-web-1:
          ansible_host: 192.0.2.11 # TEST-NET-1 placeholder, replace

    # ---------------------------------------------------------------------
    # Not deployed yet — declared so the shape is visible and nobody invents
    # a different one later. Each lands with its own task, exactly as in
    # docker-compose.yml:
    #
    #   api        backend API (stack blocked on D-003)              E9-T3
    #   database   PostgreSQL, encrypted at rest              E9-T2, E9-T6
    #   cache      Redis — cache, streams, broker                    E9-T5
    #   storage    S3-compatible object storage                      E9-T4
    #   mail       SMTP with valid certificates                      E5-T2
    #   proxy      reverse proxy / load balancer, TLS                E10-T4
    #   backup     backup agent shipping off-host                    E10-T5
    # ---------------------------------------------------------------------

  vars:
    ansible_user: deploy
    ansible_python_interpreter: /usr/bin/python3
