# Libertin — strukturovaný backlog odvozený ze zadávací dokumentace
# Zdroj požadavků: příloha smlouvy o dílo (mimo repo). Mapování na požadavky:
# docs/requirements-traceability.md. Kódy req: A1-A4, B1-B14, C1-C13.
#
# Tento soubor je JEDINÝ zdroj pravdy o rozsahu a stavu práce. Loop i agenti
# z něj čtou, co je na řadě, a po dokončení sem zapisují stav.
#
# status:   todo | in_progress | review | done | blocked
# scope:    client-web | client-mobile | shared-ui | backend | infra | qa | docs | decision
# role:     který tým/role vlastní (viz .claude/agents/)
# blocked_by: seznam id, které musí být done, nebo důvod blokace v `blocker`

meta:
  contract_scope: full-system   # rozhodnuto objednatelem: celý systém dle smlouvy,
                                # ne pouze klientská vrstva nad legacy API
  legacy_platform: swingerslife.cz   # Laravel; viz docs/live-audit.md
  acceptance_response_budget_ms: 1500   # C12.1 — tvrdý akceptační limit
  languages: [cs, en]                   # B13 — plná dodávka
  vcs_target: gitlab                    # C10 — dnes GitHub, viz D-002

# ---------------------------------------------------------------------------
# ROZHODNUTÍ, která blokují velké bloky práce (vlastník: objednatel)
# ---------------------------------------------------------------------------
decisions:
  - id: D-001
    title: Editor access do Figma hand-off souboru
    req: [C1, A3]
    status: blocked
    blocker: >
      Účet má na souboru pouze seat "View" (starter tier); Figma MCP vyžaduje
      editor access. Bez něj nelze provést design-parity, extrahovat design
      tokens ani zjistit skutečný počet obrazovek = neznámý rozsah díla.
    verified: >
      2026-08-15, znovu ověřeno na odkazu s node-id 3786-159470. Všechny tři
      čtecí nástroje Figma MCP vrací tutéž chybu "Looks like you don't have edit
      access to this file": get_metadata, get_screenshot i get_variable_defs.
      whoami potvrzuje handle "spare", e-mail dallheimal@gmail.com, jediný plán
      "Vojtěch Špaček's team", seat View, tier starter. Veřejné načtení URL bez
      přihlášení vrací jen SPA shell, žádný náhled ani og:image.
      Podstatné a snadno zaměnitelné: Figma hlídá edit oprávnění i u ČTENÍ přes
      MCP. Nejde tedy o to, že bychom chtěli zdrojový soubor měnit — needitujeme
      ho — ale o to, že bez edit seatu API odmítne soubor i jen přečíst.
      Sdílení "kdokoli s odkazem může zobrazit" tuhle bránu neotevře.
    unblock_options:
      - >
        Pozvat dallheimal@gmail.com na soubor BF3X0FKBKEbt5uTcrO4jkk s právem
        "can edit" (u Organization/Enterprise plánu stačí Dev seat). Zdroj
        needitujeme; právo je potřeba jen proto, aby API dovolilo čtení.
      - >
        Bez jakékoli změny oprávnění: export všech obrazovek z Figmy do PNG/PDF
        a commit do repa (např. docs/design/). Odpovídá to i přání objednatele,
        že podklady dodává on — a odblokuje to inventuru obrazovek (E1-T1)
        i design-parity (E1-T3). Extrakce Figma variables (E1-T2) tím ale
        odblokovaná není: z obrázků se nedají vyčíst hodnoty tokenů.
  - id: D-002
    title: GitLab vs GitHub pro hosting a CI/CD
    req: [C10, C11]
    status: blocked
    blocker: Smlouva vyžaduje GitLab; vývoj běží na GitHubu. Mirror nebo přesun?
    note: >
      2026-08: projekt dostal vlastní repozitář sparesparrow/libertin (dříve
      podadresář libertin/ v sparesparrow/mia, PR sparesparrow/mia#102). Kořen
      gitu je nově kořen pnpm workspace, takže případný přesun na GitLab je
      čistý import repozitáře — .gitlab-ci.yml už žádné úpravy cest nepotřebuje.
      Samotná volba GitLab vs GitHub zůstává otevřená.
  - id: D-003
    title: Backend stack — rozšířit legacy Laravel, nebo psát nově?
    req: [A3, C3, C6]
    status: blocked
    blocker: >
      Smlouva říká "vyvíjen od nuly", ale legacy je Laravel s daty k migraci
      (C13). Volba určuje E9 i migrační strategii. Podklad: RES-001.
  - id: D-004
    title: Hosting a poskytovatel cloudu
    req: [A1, C2, C5]
    status: blocked
    blocker: >
      Smlouva jmenuje DigitalOcean/AWS a zároveň žádá maximum on-premise (C2).
      Nutno sladit s rozpočtem a požadavkem na HA.
  - id: D-006
    title: Smí být SMS jediným aktivním druhým faktorem člena?
    req: [B4.2, B14]
    status: blocked
    blocker: >
      security doporučuje ne (nejdřív TOTP nebo passkey) kvůli SIM swapu;
      doslovné čtení B4.2 lze ale vyložit tak, že SMS samotná stačí. Obě
      varianty i návrh fallbacku jsou v ADR 0001 §15. Blokuje E2-T4.

  - id: D-007
    title: Jak se měří C12.1 — co je "špičkové zatížení" a na jakém percentilu?
    req: [C12.1]
    status: blocked
    blocker: >
      Harness (E11-T4) je hotový, ale dvě čísla v něm jsou zástupná a obě
      rozhodují o tom, co projde akceptací:
      (1) Špička. Smlouva žádné číslo neuvádí. Kolik souběžných členů má systém
      unést ve špičce? Dokud to nevíme, není proti čemu měřit.
      (2) Percentil. Doslovné čtení "odezva do 1,5 s" je p(100), tedy každá
      odpověď bez výjimky. Standardní inženýrské čtení je p(95), což harness
      používá jako výchozí. p(100) přes reálnou síť spadne na jediné pauze GC
      nebo retransmisi TCP — testuje pak spíš síť než systém.
      Do vyřešení platí, že zelený běh dokazuje funkční harness, ne splněnou
      smlouvu. Blokuje E11-T4b.

  - id: D-005
    title: AI-asistovaná moderace obsahu — mimo smlouvu, navrženo
    req: [C2]
    status: blocked
    blocker: >
      Adult platforma prakticky potřebuje moderaci nahrávaného obsahu, smlouva
      ji ale nezmiňuje a C2 nařizuje minimalizaci externích služeb. Vyžaduje
      výslovné schválení (rozsah, cena, právní rámec) i volbu on-prem vs API.

