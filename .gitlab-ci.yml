# Libertin CI — GitLab translation of .github/workflows/ci.yml.
#
# Status: NOT EXECUTED. The project lives on GitHub today (backlog D-002, the
# contract mandates GitLab per C10/C11.1). This file is kept faithful to the
# GitHub pipeline so the move is a translation, not a rewrite — but nobody has
# run it on a GitLab runner yet. Treat it as reviewed-but-unverified until a
# runner has actually gone green. See docs/ci.md.
#
# This file is written for a repository whose root IS the pnpm workspace root,
# which now matches the actual layout: Libertin has its own repository and the
# git root is the workspace root.

stages:
  - install
  - type-check
  - test
  - build
  - e2e
  - perf

variables:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
  # pnpm content-addressable store, kept inside the build dir so GitLab can cache it.
  PNPM_STORE: '$CI_PROJECT_DIR/.pnpm-store'

default:
  image: node:22-bookworm-slim
  before_script:
    - corepack enable
    - corepack prepare --activate
    - pnpm config set store-dir "$PNPM_STORE"

# Cached pnpm store, keyed on the lockfile — the GitLab counterpart of
# actions/setup-node's `cache: pnpm`.
.pnpm_cache: &pnpm_cache
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store
    - node_modules
    - apps/*/node_modules
    - packages/*/node_modules

# Merge requests, branch pipelines and manual runs. No `changes:` clause is
# needed because the whole project IS Libertin — the same reason the GitHub
# workflow carries no `paths:` filter.
.libertin_rules: &libertin_rules
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'web'

install:
  stage: install
  <<: *libertin_rules
  cache:
    <<: *pnpm_cache
    policy: pull-push
  script:
    - pnpm install --frozen-lockfile

type-check:
  stage: type-check
  <<: *libertin_rules
  cache:
    <<: *pnpm_cache
    policy: pull
  script:
    - pnpm install --frozen-lockfile --prefer-offline
    - pnpm type-check

test:
  stage: test
  <<: *libertin_rules
  cache:
    <<: *pnpm_cache
    policy: pull
  script:
    - pnpm install --frozen-lockfile --prefer-offline
    - pnpm test:all

build:
  stage: build
  <<: *libertin_rules
  cache:
    <<: *pnpm_cache
    policy: pull
  script:
    - pnpm install --frozen-lockfile --prefer-offline
    - pnpm build
  # No artifacts are exported on purpose: nothing downstream consumes the build
  # output yet, and build output is not something we want lying around in job
  # storage. Add artifacts when a deploy stage actually needs them.

# End-to-end against this repo's own client (backlog E11-T5).
#
# Gates merges, because it is deterministic: it builds apps/web, serves the
# production build and drives it with stubbed network calls. No deployment, no
# credentials, no third party.
#
# `node:22-bookworm-slim` carries none of the libraries Electron needs, so they
# are installed here. The alternative is the `cypress/browsers` image, which is
# a heavier pull and would diverge from the image every other job uses.
e2e:
  stage: e2e
  <<: *libertin_rules
  variables:
    # Outside node_modules, so the pnpm cache does not cover the ~250 MB binary.
    CYPRESS_CACHE_FOLDER: '$CI_PROJECT_DIR/.cypress-cache'
  script:
    - apt-get update && apt-get install -y --no-install-recommends
      libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xauth xvfb libasound2 libgbm1 ca-certificates curl
    - pnpm install --frozen-lockfile --prefer-offline
    - pnpm --filter @libertin/e2e cy:verify
    - pnpm --filter @libertin/web build
    - pnpm --filter @libertin/e2e e2e:local:ci
  cache:
    - <<: *pnpm_cache
      policy: pull
    - key: cypress-$CI_JOB_IMAGE
      paths:
        - .cypress-cache
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - apps/e2e/screenshots/
      - apps/e2e/reports/

# End-to-end against a deployed client. Manual, on purpose.
#
# It targets a deployment this pipeline does not produce, so a red run may be
# reporting on someone else's push; and seven of the nine modules sit behind a
# login, so it needs a test account that only exists as a masked variable.
# Without that account those specs skip rather than pass.
#
# Required CI/CD variables: E2E_BASE_URL, and E2E_TEST_USERNAME /
# E2E_TEST_PASSWORD as masked+protected. The account behind them must be a
# throwaway test member with no real personal data.
e2e-modules:
  stage: e2e
  <<: *libertin_rules
  when: manual
  allow_failure: true
  variables:
    CYPRESS_CACHE_FOLDER: '$CI_PROJECT_DIR/.cypress-cache'
    CYPRESS_BASE_URL: '$E2E_BASE_URL'
    CYPRESS_TEST_USERNAME: '$E2E_TEST_USERNAME'
    CYPRESS_TEST_PASSWORD: '$E2E_TEST_PASSWORD'
  script:
    - apt-get update && apt-get install -y --no-install-recommends
      libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xauth xvfb libasound2 libgbm1 ca-certificates curl
    - pnpm install --frozen-lockfile --prefer-offline
    - pnpm --filter @libertin/e2e e2e:modules
    - pnpm --filter @libertin/e2e e2e:platform
  cache:
    - <<: *pnpm_cache
      policy: pull
    - key: cypress-$CI_JOB_IMAGE
      paths:
        - .cypress-cache
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - apps/e2e/reports/
      - apps/e2e/screenshots/

# C12.1 acceptance harness. `when: manual` for the same reason the GitHub job is
# workflow_dispatch: a shared runner's timings swing too much to gate merges on,
# and a flaky perf gate teaches people to re-run until green. Point it at a
# representative host. Rationale and budget: perf/k6/README.md.
perf:
  stage: perf
  <<: *libertin_rules
  when: manual
  allow_failure: false
  cache:
    <<: *pnpm_cache
    policy: pull
  variables:
    K6_VERSION: '0.54.0'
  script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
    - pnpm install --frozen-lockfile --prefer-offline
    - pnpm --filter @libertin/web build
    - >-
      curl -sSL "https://github.com/grafana/k6/releases/download/v${K6_VERSION}/k6-v${K6_VERSION}-linux-amd64.tar.gz"
      | tar xz --strip-components=1 -C /usr/local/bin "k6-v${K6_VERSION}-linux-amd64/k6"
    - k6 version
    # Production build, not `next dev` — dev-mode numbers are meaningless.
    - pnpm --filter @libertin/web start &
    - for _ in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3000/ && break; sleep 1; done
    # k6 exits 99 when a threshold is crossed, which fails this job.
    - k6 run perf/k6/web-browse.js
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - perf/k6/.results/
